name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Tofu Init
        run: tofu init

      - name: Tofu Apply
        run: tofu apply -auto-approve
        env:
          TF_VAR_key_name: ${{ secrets.KEY_NAME }}
          TF_VAR_tg_bot_token: ${{ secrets.TG_BOT_TOKEN }}

      - name: Get instance IP
        id: ip
        run: echo "host=$(tofu output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 "ubuntu@${{ steps.ip.outputs.host }}" true 2>/dev/null; then
              echo "SSH ready after ~${i}0s"
              exit 0
            fi
            echo "Waiting for SSH... (attempt $i/30)"
            sleep 10
          done
          echo "SSH not available after 5 minutes"
          exit 1

      - name: Deploy to instance
        run: |
          rsync -avz --exclude '.git' --exclude 'venv' --exclude '__pycache__' --exclude '.terraform' --exclude '*.tfstate*' --exclude 'terraform.tfvars' --exclude 'bootstrap' \
            -e "ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no" \
            ./ "ubuntu@${{ steps.ip.outputs.host }}:~/voxfoxbot/"
          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no "ubuntu@${{ steps.ip.outputs.host }}" \
            'sudo cp ~/voxfoxbot/voxfoxbot.service /etc/systemd/system/ && sudo systemctl daemon-reload && sudo systemctl enable --now voxfoxbot && sudo systemctl restart voxfoxbot'
