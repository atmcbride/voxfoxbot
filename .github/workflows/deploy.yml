name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_VAR_tg_bot_token: ${{ secrets.TG_BOT_TOKEN }}
      TF_VAR_image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Tofu Init
        run: tofu init

      # The Lambda function references the image, so the repo must exist and
      # hold the tag before the full apply.
      - name: Ensure ECR repository exists
        run: tofu apply -auto-approve -target=aws_ecr_repository.voxfoxbot

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/voxfoxbot:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Tofu Apply
        run: tofu apply -auto-approve

      - name: Point Telegram at the new deployment
        run: |
          URL=$(tofu output -raw webhook_url)
          SECRET=$(tofu output -raw webhook_secret)
          curl -fsS "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/setWebhook" \
            -d "url=${URL}" \
            -d "secret_token=${SECRET}" \
            -d 'allowed_updates=["message","channel_post"]' \
            | grep -q '"ok":true'
